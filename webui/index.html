<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mihomo-ksu</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="view-main">
<header class="topbar">
  <div>
    <h1>mihomo-ksu</h1>
    <p class="muted" id="versions"></p>
  </div>
</header>

<main class="content">
  <section class="banner" id="banner" aria-labelledby="banner-title" hidden>
    <div class="banner-body">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
      <div class="list-text">
        <h2 id="banner-title" data-i18n="banner.title"></h2>
        <p id="banner-desc"></p>
      </div>
    </div>
    <div class="banner-actions">
      <button class="btn btn-info-text" id="banner-preview" data-i18n="banner.preview"></button>
      <button class="btn btn-info" id="banner-apply" data-i18n="banner.apply"></button>
    </div>
  </section>

  <section class="card" id="status" aria-live="polite">
    <div class="card-header">
      <div class="status-title">
        <span class="dot"></span>
        <h2 id="status-title" data-i18n="status.checking"></h2>
      </div>
      <span class="muted" id="status-pid"></span>
    </div>
    <p class="body-text" id="status-desc" hidden></p>
    <details class="log" id="status-log" hidden>
      <summary data-i18n="status.logTail"></summary>
      <pre id="status-log-text"></pre>
    </details>
    <div class="notice notice-warn" id="status-private-dns" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></svg>
      <span id="status-private-dns-text"></span>
    </div>
    <div class="actions">
      <button class="btn btn-primary grow" id="status-open-dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        <span data-i18n="status.openDashboard"></span>
      </button>
      <button class="btn btn-secondary" id="status-restart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        <span data-i18n="status.restart"></span>
      </button>
    </div>
  </section>

  <section class="card" aria-labelledby="subs-title">
    <div class="card-header">
      <h2 class="card-title" id="subs-title" data-i18n="subs.title"></h2>
      <span class="muted" id="subs-count"></span>
    </div>
    <p class="notice notice-warn" id="subs-unavailable" data-i18n="subs.unavailable" hidden></p>
    <p class="body-text" id="subs-empty" data-i18n="subs.empty" hidden></p>
    <div class="list" id="subs-list"></div>
    <button class="btn btn-text" id="subs-add">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="subs.add"></span>
    </button>
  </section>

  <section class="card" aria-labelledby="rules-title">
    <div class="card-header">
      <h2 class="card-title" id="rules-title" data-i18n="rules.title"></h2>
      <span class="muted" data-i18n="rules.subtitle"></span>
    </div>
    <p class="notice notice-warn" id="rules-unavailable" data-i18n="rules.unavailable" hidden></p>
    <div id="rules-body">
      <p class="group-label" data-i18n="rules.prepend"></p>
      <div class="list" id="rules-prepend"></div>
      <p class="body-text" id="rules-prepend-empty" data-i18n="rules.none" hidden></p>
      <p class="group-label" data-i18n="rules.append"></p>
      <div class="list" id="rules-append"></div>
      <p class="body-text" id="rules-append-empty" data-i18n="rules.none" hidden></p>
    </div>
    <button class="btn btn-text" id="rules-add">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="rules.add"></span>
    </button>
  </section>

  <section class="card" aria-labelledby="apps-title">
    <div class="card-header">
      <h2 class="card-title" id="apps-title" data-i18n="apps.title"></h2>
      <span class="muted" id="apps-count"></span>
    </div>
    <p class="body-text" data-i18n="apps.desc"></p>
    <p class="notice notice-warn" id="apps-unavailable" data-i18n="apps.unavailable" hidden></p>
    <div class="list" id="apps-list"></div>
    <button class="btn btn-text" id="apps-pick">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M4 12h10M4 17h6M16 15l2.5 2.5L22 13"/></svg>
      <span data-i18n="apps.pick"></span>
    </button>
  </section>

  <section class="card">
    <h2 class="card-title" data-i18n="advanced.title"></h2>
    <div class="list">
      <button class="list-row" id="advanced-edit">
        <span class="list-text"><span data-i18n="advanced.editYaml"></span><span class="muted" data-i18n="advanced.editYamlHint"></span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="list-row" id="advanced-preview">
        <span class="list-text"><span data-i18n="advanced.preview"></span><span class="muted" data-i18n="advanced.previewHint"></span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>
</main>

<div class="savebar" id="savebar" hidden>
  <span id="savebar-text"></span>
  <button class="btn btn-on-dark" id="savebar-discard" data-i18n="savebar.discard"></button>
  <button class="btn btn-on-dark-primary" data-action="save" data-i18n="save.save"></button>
</div>
</div>

<div class="page" id="view-editor" hidden>
  <header class="page-header">
    <button class="icon-btn" data-action="back" data-i18n-label="nav.back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    <div><h1 data-i18n="editor.title"></h1><p class="muted" data-i18n="editor.subtitle"></p></div>
  </header>
  <div class="notice notice-info page-gutter">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>
    <span data-i18n="editor.notice"></span>
  </div>
  <label class="visually-hidden" for="editor-text" data-i18n="editor.label"></label>
  <textarea class="code-editor page-gutter" id="editor-text" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <div class="page-actions">
    <button class="btn btn-secondary grow" id="editor-preview" data-i18n="editor.preview"></button>
    <button class="btn btn-primary grow" data-action="save" data-i18n="save.save"></button>
  </div>
</div>

<div class="page" id="view-preview" hidden>
  <header class="page-header">
    <button class="icon-btn" data-action="back" data-i18n-label="nav.back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    <div><h1 data-i18n="preview.title"></h1><p class="muted" data-i18n="preview.subtitle"></p></div>
  </header>
  <p class="notice notice-error page-gutter" id="preview-error" hidden></p>
  <pre class="code-view page-gutter" id="preview-text"></pre>
</div>

<template id="icon-edit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg></template>

<div class="page" id="view-subscription" hidden>
  <header class="page-header">
    <button class="icon-btn" data-action="back" data-i18n-label="subEdit.cancel">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h1 class="grow" id="sub-title"></h1>
    <button class="btn btn-primary" id="sub-done" data-i18n="edit.done"></button>
  </header>
  <div class="page-body">
    <div class="segmented" id="sub-source" role="radiogroup" data-i18n-label="subEdit.source">
      <button role="radio" data-source="url" data-i18n="subEdit.sourceUrl"></button>
      <button role="radio" data-source="file" data-i18n="subEdit.sourceFile"></button>
    </div>
    <div class="field">
      <label for="sub-name" data-i18n="subEdit.name"></label>
      <input class="input" id="sub-name" autocomplete="off" autocapitalize="off" aria-describedby="sub-name-hint sub-name-error">
      <span class="hint" id="sub-name-hint" data-i18n="subEdit.nameHint"></span>
      <span class="field-error" id="sub-name-error" hidden></span>
    </div>
    <div class="field" id="sub-url-field">
      <label for="sub-url" data-i18n="subEdit.url"></label>
      <textarea class="input input-mono" id="sub-url" rows="3" spellcheck="false" autocapitalize="off" aria-describedby="sub-url-hint sub-url-error"></textarea>
      <span class="hint" id="sub-url-hint" data-i18n="subEdit.urlHint"></span>
      <span class="field-error" id="sub-url-error" hidden></span>
    </div>
    <div class="field" id="sub-file-field">
      <label for="sub-file-pick" data-i18n="subEdit.file"></label>
      <button class="btn btn-secondary btn-pick" id="sub-file-pick" data-i18n="subEdit.pickFile" aria-describedby="sub-file-hint sub-file-error"></button>
      <div class="file-box" id="sub-file-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/></svg>
        <span class="list-text"><span class="row-name" id="sub-file-name"></span><span class="hint" id="sub-file-detail"></span></span>
        <button class="btn btn-plain" id="sub-file-repick" data-i18n="subEdit.repickFile"></button>
      </div>
      <input type="file" id="sub-file-input" hidden>
      <span class="hint" id="sub-file-hint" data-i18n="subEdit.fileHint"></span>
      <span class="field-error" id="sub-file-error" hidden></span>
    </div>
    <div class="field" id="sub-interval-field">
      <label for="sub-interval" data-i18n="subEdit.interval"></label>
      <select class="input" id="sub-interval" aria-describedby="sub-interval-hint"></select>
      <span class="hint" id="sub-interval-hint" data-i18n="subEdit.intervalHint"></span>
    </div>
    <button class="btn btn-danger-text" id="sub-delete" data-i18n="subEdit.delete"></button>
  </div>
</div>


<template id="icon-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></template>

<div class="page" id="view-rule" hidden>
  <header class="page-header">
    <button class="icon-btn" data-action="back" data-i18n-label="subEdit.cancel">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h1 class="grow" id="rule-title"></h1>
    <button class="btn btn-primary" id="rule-done" data-i18n="edit.done"></button>
  </header>
  <div class="page-body">
    <div class="segmented" id="rule-position" role="radiogroup" data-i18n-label="rules.position">
      <button role="radio" data-position="prepend" data-i18n="rules.positionPrepend"></button>
      <button role="radio" data-position="append" data-i18n="rules.positionAppend"></button>
    </div>
    <div class="group">
      <label class="group-row">
        <span data-i18n="rules.type"></span>
        <select class="row-select" id="rule-type"></select>
      </label>
      <div class="group-field">
        <label for="rule-value" data-i18n="rules.value"></label>
        <input class="row-input" id="rule-value" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="rule-value-hint rule-value-error">
      </div>
      <label class="group-row">
        <span data-i18n="rules.policy"></span>
        <select class="row-select" id="rule-policy"></select>
      </label>
      <label class="group-row" id="rule-no-resolve-row">
        <span class="list-text"><span data-i18n="rules.noResolve"></span><span class="hint" data-i18n="rules.noResolveHint"></span></span>
        <input class="switch" type="checkbox" id="rule-no-resolve">
      </label>
    </div>
    <span class="hint" id="rule-value-hint"></span>
    <span class="field-error" id="rule-value-error" hidden></span>
    <div class="preview-box">
      <span class="hint" data-i18n="rules.preview"></span>
      <code id="rule-preview"></code>
    </div>
    <button class="btn btn-danger-text" id="rule-delete" data-i18n="rules.delete"></button>
  </div>
</div>

<div class="page" id="view-apps" hidden>
  <header class="page-header">
    <button class="icon-btn" data-action="back" data-i18n-label="subEdit.cancel">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h1 class="grow" data-i18n="apps.title"></h1>
    <button class="btn btn-primary" id="apps-done" data-i18n="edit.done"></button>
  </header>
  <div class="page-body apps-body">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="apps-search" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-label="apps.search">
    </label>
    <div class="apps-filter">
      <span class="hint grow" data-i18n="apps.desc"></span>
      <button class="chip" id="apps-system" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
        <span data-i18n="apps.system"></span>
      </button>
    </div>
    <p class="group-label" id="apps-checked-label"></p>
    <div class="group" id="apps-checked"></div>
    <p class="group-label" id="apps-others-label" data-i18n="apps.others"></p>
    <div class="group" id="apps-others"></div>
    <p class="body-text" id="apps-none" data-i18n="apps.none" hidden></p>
  </div>
</div>

<dialog class="dialog" id="error-dialog" aria-labelledby="error-title">
  <h2 id="error-title"></h2>
  <p id="error-message"></p>
  <pre id="error-log" hidden></pre>
  <div class="dialog-actions"><button class="btn btn-primary" id="error-close"></button></div>
</dialog>
</body>
</html>
